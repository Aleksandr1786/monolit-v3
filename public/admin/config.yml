backend:
  name: github
  repo: Aleksandr1786/monolit-v3
  branch: main
  base_url: https://decap-proxy.netlify.app

media_folder: public/images
public_folder: /images

locale: ru

collections:

  - name: home
    label: Главная страница
    files:
      - name: stats
        label: Блок статистики
        file: src/content/home/stats.json
        fields:
          - { label: Завершённых объектов, name: projects, widget: number }
          - { label: Лет на рынке, name: years, widget: number }

  - name: calculator
    label: Калькулятор
    files:
      - name: packages
        label: Пакеты и цены
        file: src/content/calculator/packages.json
        fields:
          - label: Пакеты
            name: packages
            widget: list
            fields:
              - { label: Название, name: name, widget: string }
              - { label: Цена за м², name: price, widget: number }
              - { label: Описание, name: description, widget: text }

  - name: portfolio
    label: Портфолио
    folder: src/content/portfolio
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Название, name: title, widget: string }
      - label: Стиль
        name: category
        widget: select
        options:
          - { label: Эхо классики, value: classic }
          - { label: Честная фактура, value: industrial }
          - { label: Тишина и воздух, value: minimal }
      - { label: Фото, name: image, widget: image }

  - name: reviews
    label: Отзывы
    folder: src/content/reviews
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Имя, name: name, widget: string }
      - { label: Тип квартиры, name: apartment, widget: string }
      - { label: Пакет, name: package, widget: string }
      - { label: Текст, name: text, widget: text }

  - name: contacts
    label: Контакты
    files:
      - name: info
        label: Контактная информация
        file: src/content/contacts/info.json
        fields:
          - { label: Телефон, name: phone, widget: string }
          - { label: Email, name: email, widget: string }
          - { label: Город, name: city, widget: string }